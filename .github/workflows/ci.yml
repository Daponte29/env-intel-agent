name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file for CI
        run: cp .env.example .env || echo "DATABASE_URL=postgresql://user:password@db:5432/env_intel" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Services
        run: |
          docker compose up --build -d db backend
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10  # Give the db container a moment to initialize

      - name: Run Backend Tests
        # The -T flag disables pseudo-TTY allocation, which is required in non-interactive CI environments
        run: docker compose exec -T backend pytest tests/ -v

      - name: Tear Down Services
        if: always()
        run: docker compose down -v